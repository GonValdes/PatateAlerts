# Notification settings
notifications:
  telegram:
    enabled: true
    # Bot token and chat ID are in .env file
  
  # Status notification frequency
  # Options: "every_run" (send on each scheduler execution), "weekly" (once per week), "disabled" (no status messages)
  # Start with "every_run" to verify behavior, then switch to "weekly" to minimize noise
  status_frequency: "every_run"

  # Alert mode: which alert types actually fire (independent of status_frequency above)
  # Options: "all" (entry + exit alerts), "only_exit" (exit alerts only, entry alerts suppressed), "disabled" (no alerts)
  mode: "all"

# Data settings
data:
  # Cache data for this many days
  cache_days: 365
  # Refresh data if older than this many hours
  refresh_hours: 1
